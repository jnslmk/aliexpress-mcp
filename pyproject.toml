[project]
name = "aliexpress-mcp"
version = "0.4.0"
description = "MCP server for AliExpress product search — self-hosted, no API key"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.4",
    "curl_cffi>=0.7.0",
    # Browser transport for product detail (see browser.py). patchright is a
    # drop-in Playwright fork with anti-detection patches, same choice as the
    # sibling baumarkt-mcp.
    "patchright>=1.49",
]

[project.scripts]
aliexpress-mcp = "aliexpress_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aliexpress_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# The package is imported from the source tree during tests; no install step.
pythonpath = ["."]
testpaths = ["tests"]
